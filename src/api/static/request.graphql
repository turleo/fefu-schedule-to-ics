query ReadLessons {
  lessons(start_time: "%s 00:00:00", end_time: "%s 00:00:00", academic_groups: %j) {
    guid
    discipline {
      name
    }
    start_time
    end_time
    academicGroup {
      name
    }
    facility {
      name
    }
    teacher {
      fullName
      academicDegree {
        name
      }
    }
    academicControl {
      name
    }
    ppsLoad {
      name
    }
    academicSubgroup {
      name
    }
    distance_education_url
  }
}